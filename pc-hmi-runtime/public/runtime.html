<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Plant HMI Runtime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=0.5.40" />
    <script>
      (function () {
        if (new URLSearchParams(location.search).get('embed') !== '1') return;
        document.documentElement.classList.add('embed-root');
        document.addEventListener('DOMContentLoaded', function () {
          document.getElementById('runtimeHeader')?.classList.add('hidden');
          document.getElementById('navBar')?.classList.add('hidden');
          document.getElementById('alarmBanner')?.classList.add('hidden');
          document.getElementById('app')?.classList.add('embed-mode');
          document.body?.classList.add('embed-body');
        });
      })();
    </script>
  </head>
  <body>
    <div id="app" class="hmi-app">
      <header class="hmi-header" id="runtimeHeader">
        <div class="header-left">
          <div class="logo-mark">PH</div>
          <div>
            <div class="header-title" id="projectName">Plant HMI</div>
            <div class="header-subtitle" id="screenTitle">Loading...</div>
          </div>
        </div>
        <div class="header-center" id="headerIndicators"></div>
        <div class="header-right">
          <div class="clock" id="clock"></div>
          <div class="comm-status" id="commStatus">
            <span class="dot"></span>
            <span>Connecting...</span>
          </div>
        </div>
      </header>

      <main class="hmi-content" id="screenContent"></main>

      <footer class="alarm-banner hidden" id="alarmBanner">
        <span class="alarm-icon">⚠</span>
        <span id="alarmBannerText"></span>
        <button type="button" id="ackBannerBtn" class="ack-btn">Acknowledge</button>
      </footer>

      <nav class="hmi-nav" id="navBar"></nav>
    </div>

    <dialog id="runtimeCommDialog" class="dialog runtime-comm-dialog">
      <form method="dialog" onsubmit="return false">
        <h3>Communication Mode</h3>
        <p class="dialog-hint">Switch between offline simulator and live Allen-Bradley PLC (EtherNet/IP).</p>
        <label class="dialog-field">
          <span>Mode</span>
          <select id="runtimeCommDriver">
            <option value="simulator">Simulator (demo data)</option>
            <option value="ethernet-ip">Live PLC (EtherNet/IP)</option>
          </select>
        </label>
        <label class="dialog-field hidden" id="runtimeCommIpRow">
          <span>PLC IP address</span>
          <input type="text" id="runtimeCommIp" placeholder="192.168.1.10" />
        </label>
        <label class="dialog-field hidden" id="runtimeCommPathRow">
          <span>Processor slot</span>
          <input type="text" id="runtimeCommPath" value="0" />
        </label>
        <label class="dialog-field dialog-check">
          <input type="checkbox" id="runtimeCommPersist" />
          <span>Save as project default</span>
        </label>
        <div id="runtimeCommStatus" class="runtime-comm-status"></div>
        <div class="dialog-actions">
          <button type="button" id="runtimeCommTest">Test Connection</button>
          <button type="button" id="runtimeCommCancel">Cancel</button>
          <button type="button" id="runtimeCommApply" class="primary">Apply</button>
        </div>
      </form>
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script src="expression-eval.js?v=0.1.0"></script>
    <script src="/shared/parameter-file-builder.js?v=0.1.0"></script>
    <script src="parameter-files.js?v=0.2.1"></script>
    <script src="components/registry.js?v=0.3.107"></script>
    <script src="template-compose.js?v=0.2.17"></script>
    <script src="app.js?v=0.2.40"></script>
  </body>
</html>
