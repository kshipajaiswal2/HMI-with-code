<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display XML Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="workspace-toolbar.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>Display XML Bridge</h1>
        <div class="status-card" id="bridgeStatus">
          <span class="dot"></span>
          <span>Checking bridge...</span>
        </div>
      </header>

      <section class="grid" id="mainGrid">
        <article class="card exports-card">
          <div class="displays-header">
            <h2>Projects</h2>
            <div class="header-actions">
              <button id="newProjectBtn" type="button" class="mode-btn accent">New Project</button>
              <button id="toggleSidebarBtn" type="button" class="sidebar-edge-toggle" aria-label="Hide projects sidebar" title="Hide projects sidebar" aria-pressed="false">
                <span class="edge-icon-bar"></span>
                <span class="edge-icon-bar"></span>
                <span class="edge-icon-bar"></span>
              </button>
            </div>
          </div>
          <button id="importFolderBtn" type="button" class="import-folder-btn">Import Folder</button>
          <div id="projectCreatePanel" class="project-create-panel hidden">
            <label for="projectNameInput">Project name</label>
            <input id="projectNameInput" type="text" maxlength="80" placeholder="My Project" />
            <div class="project-create-actions">
              <button id="createProjectBtn" type="button" class="mode-btn accent">Create</button>
              <button id="cancelProjectBtn" type="button" class="mode-btn">Cancel</button>
            </div>
          </div>
          <div id="sidebarNamePanel" class="project-create-panel hidden">
            <label id="sidebarNameLabel" for="sidebarNameInput">Name</label>
            <input id="sidebarNameInput" type="text" maxlength="80" placeholder="New item" />
            <div id="sidebarScreenFields" class="sidebar-screen-fields hidden">
              <div>
                <label for="sidebarPageNoInput">Page No</label>
                <input id="sidebarPageNoInput" type="text" inputmode="numeric" maxlength="6" placeholder="200" />
              </div>
              <div>
                <label for="sidebarScreenNameInput">Screen Name</label>
                <input id="sidebarScreenNameInput" type="text" maxlength="80" placeholder="Settings" />
              </div>
              <div class="sidebar-screen-preview-row">
                <span>ID</span>
                <strong id="sidebarScreenPreview">New_Screen</strong>
              </div>
            </div>
            <div class="project-create-actions">
              <button id="sidebarNameConfirmBtn" type="button" class="mode-btn accent">Save</button>
              <button id="sidebarNameCancelBtn" type="button" class="mode-btn">Cancel</button>
            </div>
          </div>
          <input id="uploadInput" type="file" accept=".xml,text/xml,application/xml" multiple />
          <input id="defaultUploadInput" type="file" accept=".xml,text/xml,application/xml" multiple />
          <input id="uploadFolderInput" type="file" webkitdirectory multiple />
          <input id="projectTagsCsvInput" type="file" accept=".csv,text/csv,.txt,text/plain" multiple hidden />
          <input id="projectParametersCsvInput" type="file" accept=".par,.csv,text/csv,text/plain" multiple hidden />
          <input id="projectIoListInput" type="file" accept=".xlsx,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/plain" multiple hidden />
          <input id="projectPlcLogicTagsInput" type="file" accept=".csv,text/csv,.txt,text/plain" hidden />
          <input id="imageLibraryUploadInput" type="file" accept=".bmp,.png,.jpg,.jpeg,.gif,.svg,.ico,.webp,image/*" hidden />
          <ul id="displaysList" class="single-list"></ul>
        </article>

        <article class="card editor-card">
          <div class="workspace-toolbar">
            <div class="workspace-toolbar-row">
              <nav class="app-menu-bar" aria-label="Workspace menu">
                <div class="menu-group" data-menu-group>
                  <button type="button" class="menu-label" aria-haspopup="menu" aria-expanded="false">File</button>
                  <div class="menu-popup" role="menu">
                    <button id="buildPackageBtn" type="button" role="menuitem">Page Import</button>
                    <button id="buildAllPackageBtn" type="button" role="menuitem">All Import</button>
                  </div>
                </div>
                <div class="menu-group" data-menu-group>
                  <button type="button" class="menu-label" aria-haspopup="menu" aria-expanded="false">Application</button>
                  <div class="menu-popup" role="menu">
                    <button id="addObjectBtn" type="button" role="menuitem">Add Button</button>
                    <button id="addImageBtn" type="button" role="menuitem">Add Image</button>
                  </div>
                </div>
              </nav>

              <div class="workspace-toolbar-divider" aria-hidden="true"></div>

              <div class="workspace-field workspace-field-inline workspace-screen">
                <label for="displayName">Screen</label>
                <input id="displayName" type="text" readonly value="None" />
              </div>

              <div class="workspace-toolbar-divider" aria-hidden="true"></div>

              <div class="workspace-size-fields" aria-label="Screen size">
                <div class="workspace-field workspace-field-inline">
                  <label for="screenSizePreset">Preset</label>
                  <select id="screenSizePreset">
                    <option value="">Custom</option>
                    <option value="800x600">800×600</option>
                    <option value="1280x800">1280×800</option>
                    <option value="1024x768">1024×768</option>
                  </select>
                </div>
                <div class="workspace-field workspace-field-inline workspace-field-dim">
                  <label for="screenWidth">W</label>
                  <input id="screenWidth" type="number" min="1" value="1024" />
                </div>
                <div class="workspace-field workspace-field-inline workspace-field-dim">
                  <label for="screenHeight">H</label>
                  <input id="screenHeight" type="number" min="1" value="768" />
                </div>
              </div>

              <div class="workspace-toolbar-spacer" aria-hidden="true"></div>

              <div class="workspace-preview-controls" aria-label="Preview zoom">
                <span class="workspace-section-label">Preview</span>
                <div class="preview-zoom-controls">
                  <button id="previewZoomOutBtn" type="button" class="preview-zoom-btn" title="Zoom out">−</button>
                  <span id="previewZoomLabel" class="preview-zoom-label">100%</span>
                  <button id="previewZoomInBtn" type="button" class="preview-zoom-btn" title="Zoom in">+</button>
                  <button id="previewZoomResetBtn" type="button" class="preview-zoom-btn preview-zoom-reset-btn" title="Reset zoom to fit">Fit</button>
                </div>
              </div>
            </div>
          </div>

          <div class="editor-workspace">
            <div class="editor-layout" id="editorLayout">
              <div class="editor-preview">
                <div id="previewPane" class="preview-pane"></div>
              </div>

              <button id="toggleDockBtn" type="button" class="dock-edge-toggle" aria-label="Hide tools sidebar" title="Hide tools sidebar" aria-pressed="false"></button>

              <aside class="workspace-dock">
                <div class="dock-tabs" id="workspaceDockTabs" role="tablist" aria-label="Workspace tools">
                  <button type="button" class="dock-tab active" data-dock-tab="properties" role="tab" aria-selected="true">Properties</button>
                  <button type="button" class="dock-tab" data-dock-tab="xml" role="tab" aria-selected="false">XML</button>
                </div>

                <section class="dock-panel active" data-dock-panel="properties" role="tabpanel" aria-label="Selected object properties">
                  <details class="object-panel" id="objectPanelDetails" open>
                    <summary>Object</summary>

                    <div class="prop-grid">
                      <div>
                        <label for="objType">Type</label>
                        <input id="objType" type="text" readonly value="None" />
                      </div>
                      <div>
                        <label for="objName">Name</label>
                        <input id="objName" type="text" value="" />
                      </div>
                      <div>
                        <label for="objCaption">Caption</label>
                        <input id="objCaption" type="text" value="" />
                      </div>
                      <div>
                        <label for="objLeft">Left</label>
                        <input id="objLeft" type="number" min="0" value="0" />
                      </div>
                      <div>
                        <label for="objTop">Top</label>
                        <input id="objTop" type="number" min="0" value="0" />
                      </div>
                      <div>
                        <label for="objWidth">Width</label>
                        <input id="objWidth" type="number" min="1" value="1" />
                      </div>
                      <div>
                        <label for="objHeight">Height</label>
                        <input id="objHeight" type="number" min="1" value="1" />
                      </div>
                      <div class="prop-wide">
                        <label for="objBackColor">Back Color</label>
                        <div class="color-field">
                          <input id="objBackColor" type="text" value="" placeholder="#002952" />
                          <input id="objBackColorPicker" type="color" value="#002952" />
                          <span id="objBackColorSwatch" class="color-swatch" title="Back Color Preview"></span>
                        </div>
                      </div>
                      <div class="prop-wide">
                        <label for="objBorderColor">Border Color</label>
                        <div class="color-field">
                          <input id="objBorderColor" type="text" value="" placeholder="#002952" />
                          <input id="objBorderColorPicker" type="color" value="#002952" />
                          <span id="objBorderColorSwatch" class="color-swatch" title="Border Color Preview"></span>
                        </div>
                      </div>
                      <div class="prop-wide">
                        <label for="objTextColor">Text Color</label>
                        <div class="color-field">
                          <input id="objTextColor" type="text" value="" placeholder="#ffffff" />
                          <input id="objTextColorPicker" type="color" value="#ffffff" />
                          <span id="objTextColorSwatch" class="color-swatch" title="Text Color Preview"></span>
                        </div>
                      </div>
                      <div class="prop-wide" id="objImageNameRow" hidden>
                        <label for="objImageName">Image</label>
                        <div class="image-name-field">
                          <input id="objImageName" type="text" value="" placeholder="Pick a file or type library name" list="imageLibraryOptions" />
                          <button id="browseImageBtn" type="button" class="secondary">Browse…</button>
                        </div>
                        <datalist id="imageLibraryOptions"></datalist>
                      </div>
                      <div class="prop-wide font-apply-row">
                        <div class="font-size-field">
                          <label for="objFontSize">Font Size</label>
                          <input id="objFontSize" type="number" min="1" value="10" />
                        </div>
                        <button id="applyObjectBtn" type="button" class="secondary">Apply</button>
                      </div>
                    </div>
                  </details>
                </section>

                <section class="dock-panel" data-dock-panel="xml" role="tabpanel" aria-label="XML and status">
                  <details class="advanced-box" open>
                    <summary>XML</summary>
                    <label for="xmlEditor" class="visually-hidden">Display XML</label>
                    <textarea id="xmlEditor" rows="10" placeholder="Select a display…"></textarea>
                  </details>

                  <div id="packageResult" class="package-result"></div>
                </section>
              </aside>
            </div>

            <details class="object-panel popup-planner popup-planner-wide" id="popupPlannerDetails">
              <summary>Popup Planner</summary>

              <div class="planner-table-header">
                <button id="addPopupPlanRowBtn" type="button" class="secondary">Add Row</button>
              </div>

              <div class="planner-table-wrap">
                <table class="planner-table">
                  <colgroup>
                    <col class="planner-col-name" />
                    <col class="planner-col-component" />
                    <col class="planner-col-popup-type" />
                    <col class="planner-col-count" />
                    <col class="planner-col-target-screen" />
                    <col class="planner-col-generated" />
                    <col class="planner-col-action" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Component</th>
                      <th>Type</th>
                      <th>Count</th>
                      <th>Target</th>
                      <th>Generated</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="popupPlanBody"></tbody>
                </table>
              </div>

              <div class="planner-generate-actions" id="popupGenerateActions">
                <button id="generatePopupsBtn" type="button">Generate</button>
              </div>
            </details>
          </div>
        </article>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="vendor/xlsx.full.min.js"></script>
    <script src="io-tags.js"></script>
    <script src="app.js"></script>
  </body>
</html>
