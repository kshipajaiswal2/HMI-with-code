<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display XML Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="hero-title">
          <h1>Display XML Bridge</h1>
        </div>
        <div class="status-card" id="bridgeStatus">
          <span class="dot"></span>
          <span>Checking bridge...</span>
        </div>
      </section>

      <section class="grid" id="mainGrid">
        <article class="card exports-card">
          <div class="displays-header">
            <h2>Projects</h2>
            <button id="newProjectBtn" type="button" class="mode-btn accent">New Project</button>
            <button id="toggleSidebarBtn" type="button" class="sidebar-edge-toggle" aria-label="Hide projects sidebar" title="Hide projects sidebar" aria-pressed="false">
              <span class="edge-icon-bar"></span>
              <span class="edge-icon-bar"></span>
              <span class="edge-icon-bar"></span>
            </button>
          </div>
          <div id="projectCreatePanel" class="project-create-panel hidden">
            <label for="projectNameInput">Project title</label>
            <input id="projectNameInput" type="text" maxlength="80" placeholder="My Project" />
            <div class="project-create-actions">
              <button id="createProjectBtn" type="button" class="mode-btn accent">Create</button>
              <button id="cancelProjectBtn" type="button" class="mode-btn">Cancel</button>
            </div>
          </div>
          <div id="sidebarNamePanel" class="project-create-panel hidden">
            <label id="sidebarNameLabel" for="sidebarNameInput">Name</label>
            <input id="sidebarNameInput" type="text" maxlength="80" placeholder="New item" />
            <div class="project-create-actions">
              <button id="sidebarNameConfirmBtn" type="button" class="mode-btn accent">Save</button>
              <button id="sidebarNameCancelBtn" type="button" class="mode-btn">Cancel</button>
            </div>
          </div>
          <input id="uploadInput" type="file" accept=".xml,text/xml,application/xml" multiple />
          <input id="defaultUploadInput" type="file" accept=".xml,text/xml,application/xml" multiple />
          <ul id="displaysList" class="single-list"></ul>
        </article>

        <article class="card editor-card">
          <h2>Display Visual Editor</h2>

          <div class="editor-layout">
            <div class="editor-controls">
              <label for="displayName">Selected screen</label>
              <input id="displayName" type="text" readonly value="None" />

              <div class="size-grid">
                <div>
                  <label for="screenWidth">Width</label>
                  <input id="screenWidth" type="number" min="1" value="1024" />
                </div>
                <div>
                  <label for="screenHeight">Height</label>
                  <input id="screenHeight" type="number" min="1" value="768" />
                </div>
              </div>

              <div class="actions">
                <button id="previewBtn" type="button">Preview</button>
                <button id="addObjectBtn" type="button" class="secondary">Add Button</button>
                <button id="applySizeBtn" type="button" class="secondary">Apply Size to HMI</button>
                <button id="buildPackageBtn" type="button">Get Page Import</button>
                <button id="buildAllPackageBtn" type="button" class="secondary">Get All Import</button>
              </div>

              <details class="object-panel" id="objectPanelDetails">
                <summary>Selected Object Properties</summary>
                <p>Click any object in preview, edit fields, then apply.</p>

                <div class="prop-grid">
                  <div>
                    <label for="objType">Type</label>
                    <input id="objType" type="text" readonly value="None" />
                  </div>
                  <div>
                    <label for="objName">Name</label>
                    <input id="objName" type="text" value="" />
                  </div>
                  <div>
                    <label for="objCaption">Caption</label>
                    <input id="objCaption" type="text" value="" />
                  </div>
                  <div>
                    <label for="objLeft">Left</label>
                    <input id="objLeft" type="number" min="0" value="0" />
                  </div>
                  <div>
                    <label for="objTop">Top</label>
                    <input id="objTop" type="number" min="0" value="0" />
                  </div>
                  <div>
                    <label for="objWidth">Width</label>
                    <input id="objWidth" type="number" min="1" value="1" />
                  </div>
                  <div>
                    <label for="objHeight">Height</label>
                    <input id="objHeight" type="number" min="1" value="1" />
                  </div>
                  <div class="prop-wide">
                    <label for="objBackColor">Back Color</label>
                    <div class="color-field">
                      <input id="objBackColor" type="text" value="" placeholder="#002952 or silver" />
                      <input id="objBackColorPicker" type="color" value="#002952" />
                      <span id="objBackColorSwatch" class="color-swatch" title="Back Color Preview"></span>
                    </div>
                  </div>
                  <div class="prop-wide">
                    <label for="objBorderColor">Border Color</label>
                    <div class="color-field">
                      <input id="objBorderColor" type="text" value="" placeholder="#002952" />
                      <input id="objBorderColorPicker" type="color" value="#002952" />
                      <span id="objBorderColorSwatch" class="color-swatch" title="Border Color Preview"></span>
                    </div>
                  </div>
                  <div class="prop-wide">
                    <label for="objTextColor">Text Color</label>
                    <div class="color-field">
                      <input id="objTextColor" type="text" value="" placeholder="white" />
                      <input id="objTextColorPicker" type="color" value="#ffffff" />
                      <span id="objTextColorSwatch" class="color-swatch" title="Text Color Preview"></span>
                    </div>
                  </div>
                  <div class="prop-wide font-apply-row">
                    <div class="font-size-field">
                      <label for="objFontSize">Font Size</label>
                      <input id="objFontSize" type="number" min="1" value="10" />
                    </div>
                    <button id="applyObjectBtn" type="button" class="secondary">Apply</button>
                  </div>
                </div>
              </details>

              <details class="advanced-box">
                <summary>Advanced: Show XML code</summary>
                <label for="xmlEditor">Display XML</label>
                <textarea id="xmlEditor" rows="10" placeholder="Select a display to load XML..."></textarea>
              </details>

              <div id="packageResult" class="package-result"></div>
            </div>

            <div class="editor-preview">
              <h3>Preview</h3>
              <div id="previewPane" class="preview-pane"></div>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
